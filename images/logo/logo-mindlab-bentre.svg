<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 125" width="660" height="125">
  <defs>
    <!-- Top arc: from left to right along top half of circle (radius 48) -->
    <path id="arcTopText" d="M 12,60 A 48 48 0 0 1 108,60" fill="none" />
    <!-- Bottom arc: from right to left along bottom half of circle -->
    <path id="arcBottomText" d="M 108,60 A 48 48 0 0 1 12,60" fill="none" />
    
    <!-- Subtle drop shadow filter for emblem -->
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#006d64" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Left: Medical Seal Emblem -->
  <g id="medical-seal" transform="translate(4, 2)" filter="url(#logoShadow)">
    <!-- Outer Rich Emerald Green Ring -->
    <circle cx="60" cy="60" r="56" fill="#00835f" stroke="#005d43" stroke-width="2" />
    
    <!-- Top Text along curve: PKĐK MINDLAB BẾN TRE -->
    <text font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.3" font-weight="800" fill="#ffffff" letter-spacing="0.3">
      <textPath href="#arcTopText" startOffset="50%" text-anchor="middle">
        CÔNG TY TNHH PKĐK MINDLAB BẾN TRE
      </textPath>
    </text>

    <!-- Bottom Text along curve: TP. BẾN TRE -->
    <text font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6.3" font-weight="800" fill="#ffffff" letter-spacing="0.4">
      <textPath href="#arcBottomText" startOffset="50%" text-anchor="middle">
        ★ TP. BẾN TRE - TỈNH BẾN TRE ★
      </textPath>
    </text>

    <!-- Inner White Circle -->
    <circle cx="60" cy="60" r="38" fill="#ffffff" stroke="#cde9e1" stroke-width="1.5" />

    <!-- Bright Red Medical Cross -->
    <rect x="42" y="53" width="36" height="14" fill="#ef4444" rx="2" />
    <rect x="53" y="42" width="14" height="36" fill="#ef4444" rx="2" />

    <!-- Letter M (Bright Electric Teal) on left of staff -->
    <text x="46.5" y="65" font-family="'Arial Black', Impact, sans-serif" font-size="16" font-weight="900" fill="#00a896" text-anchor="middle">M</text>

    <!-- Letter L (Vibrant Crimson) on right of staff -->
    <text x="73.5" y="65" font-family="'Arial Black', Impact, sans-serif" font-size="16" font-weight="900" fill="#dc2626" text-anchor="middle">L</text>

    <!-- Rod of Asclepius in Center -->
    <line x1="60" y1="36" x2="60" y2="85" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round" />
    <polygon points="57.5,36 60,31 62.5,36" fill="#1f2937" />

    <!-- Snake body coiling staff -->
    <path d="M 54.5 43 C 62.5 39, 66.5 49, 60 54 C 52 59, 56 67, 61.5 69 C 67 71, 60 80, 58.5 83" 
          fill="none" stroke="#1f2937" stroke-width="3.8" stroke-linecap="round" />
    <path d="M 54.5 43 C 62.5 39, 66.5 49, 60 54 C 52 59, 56 67, 61.5 69 C 67 71, 60 80, 58.5 83" 
          fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <!-- Snake Head -->
    <ellipse cx="53.5" cy="42" rx="2.4" ry="1.6" fill="#1f2937" transform="rotate(-20 53.5 42)" />
    <ellipse cx="53.5" cy="42" rx="1.5" ry="0.9" fill="#ffffff" transform="rotate(-20 53.5 42)" />
  </g>

  <!-- Right: Typography Brand Name (Full width, No Clipping) -->
  <g id="brand-text" transform="translate(132, 14)">
    <!-- Main Title: MINDLAB (Bright Teal #00835f) BẾN TRE (Vivid Ruby Red #c8102e) -->
    <text x="0" y="52" font-family="'Segoe UI', 'Montserrat', Roboto, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="0.5">
      <tspan fill="#00835f" stroke="#00835f" stroke-width="0.8" paint-order="stroke fill">MINDLAB </tspan>
      <tspan fill="#c8102e" stroke="#c8102e" stroke-width="1.3" paint-order="stroke fill">BẾN TRE</tspan>
    </text>
    
    <!-- Subtitle Tagline: Thầy Thuốc Của Mọi Nhà -->
    <text x="2" y="86" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#334155" letter-spacing="0.8">
      Thầy Thuốc Của Mọi Nhà
    </text>

    <!-- Subtle accent line under tagline -->
    <rect x="2" y="93" width="90" height="3" fill="#00835f" rx="1.5" />
    <circle cx="98" cy="94.5" r="2.5" fill="#c8102e" />
  </g>
</svg>